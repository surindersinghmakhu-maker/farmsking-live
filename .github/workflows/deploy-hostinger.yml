name: Deploy Expo Web to Hostinger

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: ⚡ Export Expo Web Build
        env:
          CI: '1'
          EXPO_ROUTER_DISABLE_RN_NAVIGATION_CHECK: '1'
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL || 'https://farmsking-backend.onrender.com/api/v1' }}
        run: |
          cd frontend
          npx expo export -p web

      - name: 📂 Deploy dist to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        if: ${{ secrets.FTP_SERVER != '' }}
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          local-dir: ./frontend/dist/
          dangerous-clean-slate: false
