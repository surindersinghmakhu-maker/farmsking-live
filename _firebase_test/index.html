<!doctype html>
<html>
<head><meta charset="utf-8"><title>Firebase Phone Test</title></head>
<body style="font-family:sans-serif;padding:20px">
  <h3>Isolated Firebase phone auth test</h3>
  <input id="phone" value="+919872412668" style="width:200px;padding:6px" />
  <button id="send" style="padding:6px 12px">Send OTP</button>
  <div id="recaptcha-container"></div>
  <pre id="log" style="background:#eee;padding:10px;white-space:pre-wrap"></pre>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
    const log = (m) => { document.getElementById('log').textContent += m + "\n"; };
    const app = initializeApp({
      apiKey: "AIzaSyC4ZPSAJcbb7xHzPdWlmqNo0yX2rnLeIgo",
      authDomain: "farmsking-510606.firebaseapp.com",
      projectId: "farmsking-510606",
      appId: "1:742233980320:web:baebebe2a59b7a4857b8c5"
    });
    const auth = getAuth(app);
    const verifier = new RecaptchaVerifier(auth, 'recaptcha-container', { size: 'invisible' });
    window.__ready = true;
    document.getElementById('send').onclick = async () => {
      log('sending to ' + document.getElementById('phone').value);
      try {
        await signInWithPhoneNumber(auth, document.getElementById('phone').value, verifier);
        log('RESULT: SUCCESS (SMS requested)');
      } catch (e) {
        log('RESULT: ERROR ' + e.code + ' | ' + e.message);
      }
    };
  </script>
</body>
</html>
