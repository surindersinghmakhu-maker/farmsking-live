<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pan-India Perpetual Kisan Crop & Historical Mandi Intelligence Engine 🌾</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0284c7;
      --bg: #0f172a;
      --card-bg: #ffffff;
      --text-main: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 16px 10px;
    }

    .engine-container {
      width: 100%;
      max-width: 820px;
    }

    .main-engine-card {
      background: #ffffff;
      border-radius: 20px;
      overflow: hidden;
      border: 2.5px solid #0284c7;
      box-shadow: 0 15px 35px -5px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
    }

    .header-banner {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      padding: 18px;
      color: #ffffff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .header-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(2, 132, 199, 0.2);
      border: 1px solid #38bdf8;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      color: #38bdf8;
      text-transform: uppercase;
    }

    .lang-pills {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      gap: 3px;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.85);
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .lang-btn.active {
      background: #ffffff;
      color: #0f172a;
    }

    .app-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .app-sub {
      font-size: 11.5px;
      color: #94a3b8;
      font-weight: 500;
    }

    /* 🌟 2 MAIN TABS BAR */
    .main-tabs-bar {
      display: flex;
      background: #0f172a;
      padding: 6px;
      gap: 6px;
    }

    .main-tab-btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      background: #1e293b;
      color: #94a3b8;
      border: none;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .main-tab-btn.active-a {
      background: #d97706;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.4);
    }

    .main-tab-btn.active-b {
      background: #16a34a;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.4);
    }

    /* ⚙️ TOP CONTROL DROPDOWNS BAR */
    .top-controls-bar {
      background: #f8fafc;
      padding: 14px;
      border-bottom: 1.5px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .dropdown-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .dropdown-label { font-size: 11px; font-weight: 800; color: #0369a1; }
    .dropdown-label.green { color: #15803d; }
    .dropdown-label.amber { color: #b45309; }

    .styled-select {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1.5px solid #0284c7;
      background: #ffffff;
      color: #0369a1;
      font-size: 12.5px;
      font-weight: 800;
      outline: none;
      cursor: pointer;
    }
    .styled-select.green-select { border-color: #16a34a; color: #14532d; }
    .styled-select.amber-select { border-color: #d97706; color: #78350f; }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    /* 📊 CARDS BODY AREA */
    .body-area {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .crop-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 14px;
      border: 1.5px solid;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .crop-card.tab-a { border-color: #f59e0b; }
    .crop-card.tab-b { border-color: #16a34a; }

    /* 📅 DATES BOX HIGHLIGHTED AT TOP LEFT */
    .dates-box-left {
      background: #f0f9ff;
      border-radius: 10px;
      padding: 10px 12px;
      border: 1.5px solid #0284c7;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .date-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
    }

    .date-lbl { font-weight: 800; color: #0369a1; min-width: 150px; }
    .date-val { font-weight: 800; color: #0f172a; }
    .date-val.green { color: #15803d; }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .fest-name {
      font-size: 14.5px;
      font-weight: 800;
      color: #0f172a;
    }

    .surge-pill {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid;
    }
    .surge-pill.tab-a { background: #fef3c7; color: #b45309; border-color: #f59e0b; }
    .surge-pill.tab-b { background: #dcfce7; color: #15803d; border-color: #16a34a; }

    .crop-banner {
      background: #f8fafc;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .crop-title { font-size: 13px; font-weight: 800; color: #15803d; }
    .crop-states { font-size: 11px; font-weight: 600; color: #475569; }
    .crop-lang-names { font-size: 10.5px; font-weight: 800; color: #0284c7; }

    .direct-advice {
      padding: 10px;
      border-radius: 10px;
      border: 1.5px solid;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .direct-advice.tab-a { background: #fffbe8; border-color: #f59e0b; color: #451a03; }
    .direct-advice.tab-b { background: #f0fdf4; border-color: #16a34a; color: #064e3b; }

    .advice-head { font-size: 11.5px; font-weight: 800; }
    .advice-head.tab-a { color: #92400e; }
    .advice-head.tab-b { color: #14532d; }

    .advice-body { font-size: 12px; font-weight: 700; line-height: 1.5; }

    /* 📊 5-YEAR HISTORICAL MANDI TREND BOX */
    .mandi-trend-box {
      background: #fdf2f8;
      border-radius: 8px;
      padding: 10px;
      border: 1px solid #f472b6;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .mandi-trend-head { font-size: 11px; font-weight: 800; color: #9d174d; }
    .mandi-trend-txt { font-size: 11px; font-weight: 600; color: #831843; line-height: 1.4; }

    .whatsapp-btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 4px;
    }
    .whatsapp-btn.tab-a { background: #d97706; }
    .whatsapp-btn.tab-b { background: #16a34a; }

    .empty-state { text-align: center; padding: 20px; font-size: 12px; color: #94a3b8; font-weight: 600; }

    @media (max-width: 600px) {
      .grid-3 { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <div class="engine-container">

            <button class="lang-btn" id="btnEn" onclick="changeLang('en')">ENG</button>

          <div class="dropdown-group">

              <option value="ALL">🌐 All Crops</option>
              <option value="VEG">🥬 Vegetables (Tomato/Potato)</option>
              <option value="FLOWERS">🌸 Flowers (Year-Round)</option>
              <option value="GRAINS_CASH">🌾 Grains & Commercial</option>
              <option value="FRUITS">🍉 Fruits (Watermelon)</option>
              <option value="FODDER">🌿 Green Fodder</option>
            </select>
          </div>

          <!-- 3. Days Filter Dropdown -->
          <div class="dropdown-group">
            <label class="dropdown-label amber" id="lblDays">📅 Days Filter (Next Days):</label>
            <select class="styled-select amber-select" id="daysDropdown" onchange="changeDays(this.value)">
              <option value="30">📅 Next 30 Days</option>
              <option value="60">📅 Next 60 Days</option>
              <option value="90">📅 Next 90 Days</option>
              <option value="120">📅 Next 120 Days</option>
              <option value="999" selected>🌟 All Days</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 📊 BODY DISPLAY AREA -->
      <div class="body-area" id="bodyArea">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

    let activeMainTab = 'DEMAND_PRICE';
    let currentLang = 'pa';
    let currentStateRegion = 'ALL_INDIA';
    let currentCropFilter = 'MY_CROPS';
    let currentDays = 999;
    let farmerCrops = ['Flowers', 'Tomato', 'Potato', 'Onion', 'Chili', 'Garlic', 'Cotton', 'Mustard', 'Paddy', 'Wheat', 'Peas', 'Sugarcane', 'Watermelon'];

    function switchMainTab(tab) {
      activeMainTab = tab;
      document.getElementById('tabBtnA').classList.toggle('active-a', tab === 'DEMAND_PRICE');
      document.getElementById('tabBtnB').classList.toggle('active-b', tab === 'SOWING_PLANNING');
      renderAll();
    }

    function changeLang(val) { 
      currentLang = val; 
      document.getElementById('btnPa').classList.toggle('active', val === 'pa');
      document.getElementById('btnHi').classList.toggle('active', val === 'hi');
      document.getElementById('btnEn').classList.toggle('active', val === 'en');
      
      const t = UI_TRANSLATIONS[val] || UI_TRANSLATIONS.en;
      document.getElementById('appTitleText').innerText = t.appTitle;
      document.getElementById('appSubText').innerText = t.appSub;
      document.getElementById('tabBtnA').innerText = t.tabA;
      document.getElementById('tabBtnB').innerText = t.tabB;
      document.getElementById('lblState').innerText = t.lblState;
      document.getElementById('lblCrop').innerText = t.lblCrop;
      document.getElementById('lblDays').innerText = t.lblDays;

      renderAll(); 
    }

    function changeStateRegion(val) { currentStateRegion = val; renderAll(); }
    function changeCropFilter(val) { currentCropFilter = val; renderAll(); }
    function changeDays(val) { currentDays = parseInt(val, 10); renderAll(); }

    function renderAll() {
      const container = document.getElementById('bodyArea');
      const t = UI_TRANSLATIONS[currentLang] || UI_TRANSLATIONS.en;

      let list = CROP_INTELLIGENCE_DATA.filter(item => item.tabType === activeMainTab);

      if (currentDays !== 999) {
        list = list.filter(item => item.daysToEvent <= currentDays);
      }

      if (currentStateRegion !== 'ALL_INDIA') {
        list = list.filter(item => item.stateRegion === 'ALL_INDIA' || item.stateRegion === currentStateRegion);
      }

      if (currentCropFilter === 'MY_CROPS') {
        list = list.filter(item => {
          const nameEn = item.cropName.en.toLowerCase();
          return farmerCrops.some(fc => nameEn.includes(fc.toLowerCase()));
        });
      } else if (currentCropFilter === 'VEG') {
        list = list.filter(item => item.category === 'VEG');
      } else if (currentCropFilter === 'FLOWERS') {
        list = list.filter(item => item.category === 'FLOWERS');
      } else if (currentCropFilter === 'GRAINS_CASH') {
        list = list.filter(item => item.category === 'GRAINS_CASH');
      } else if (currentCropFilter === 'FRUITS') {
        list = list.filter(item => item.category === 'FRUITS');
      } else if (currentCropFilter === 'FODDER') {
        list = list.filter(item => item.category === 'FODDER');
      }

      if (list.length === 0) {
        container.innerHTML = `<div class="empty-state">${t.emptyText}</div>`;
        return;
      }

      const isTabA = activeMainTab === 'DEMAND_PRICE';

      container.innerHTML = list.map((item) => {
        const cropTitle = item.cropName[currentLang] || item.cropName.en;
        const festName = item.festivalName[currentLang] || item.festivalName.en;
        const priceTag = item.priceChange[currentLang] || item.priceChange.en;
        const eventDateStr = item.eventDate[currentLang] || item.eventDate.en;
        const sowDatesStr = item.sowDates[currentLang] || item.sowDates.en;
        const sowWinStr = item.sowWindow[currentLang] || item.sowWindow.en;
        const statesStr = item.statesListText[currentLang] || item.statesListText.en;
        const advice = item.farmerAdvice[currentLang] || item.farmerAdvice.en;
        const mandiTrend = item.historicalMandiTrend[currentLang] || item.historicalMandiTrend.en;

        return `
          <div class="crop-card ${isTabA ? 'tab-a' : 'tab-b'}">
            
            <!-- 🌟 DATES BOX HIGHLIGHTED FIRST ON THE LEFT / TOP -->
            <div class="dates-box-left">
              <div class="date-row">
                <span class="date-lbl">${t.eventDateLbl}</span>
                <span class="date-val">${eventDateStr}</span>
              </div>
              <div class="date-row">
                <span class="date-lbl">${t.sowDatesLbl}</span>
                <span class="date-val green">${sowDatesStr} (${sowWinStr})</span>
              </div>
            </div>

            <div class="card-top">
              <span class="fest-name">${festName}</span>
              <span class="surge-pill ${isTabA ? 'tab-a' : 'tab-b'}">${priceTag}</span>
            </div>

            <div class="crop-banner">
              <div class="crop-title">${t.cropLbl} ${cropTitle}</div>
              <div class="crop-states">${t.stateLbl} ${statesStr}</div>
              <div class="crop-lang-names">${t.localLangLbl} ${item.localLangName}</div>
            </div>

            <div class="direct-advice ${isTabA ? 'tab-a' : 'tab-b'}">
              <span class="advice-head ${isTabA ? 'tab-a' : 'tab-b'}">${t.adviceHeader}</span>
              <span class="advice-body">${advice}</span>
            </div>

            <div class="mandi-trend-box">
              <div class="mandi-trend-head">${t.mandiHeader}</div>
              <div class="mandi-trend-txt">${mandiTrend}</div>
            </div>
          </div>
        `;
      }).join('') + `
        <button class="whatsapp-btn ${isTabA ? 'tab-a' : 'tab-b'}" onclick="shareWhatsApp()">
          ${t.shareBtn}
        </button>
      `;
    }

    function shareWhatsApp() {
      const t = UI_TRANSLATIONS[currentLang] || UI_TRANSLATIONS.en;
      let list = CROP_INTELLIGENCE_DATA.filter(item => item.tabType === activeMainTab);
      if (currentDays !== 999) list = list.filter(item => item.daysToEvent <= currentDays);
      if (currentStateRegion !== 'ALL_INDIA') list = list.filter(item => item.stateRegion === 'ALL_INDIA' || item.stateRegion === currentStateRegion);

      const titleText = activeMainTab === 'DEMAND_PRICE' ? t.tabA : t.tabB;
      const text = `🌾 *${titleText}*\n\n` + 
        list.map(c => `• ${c.cropName[currentLang] || c.cropName.en} (${c.priceChange[currentLang] || c.priceChange.en})\n  📅 Dates (Left First): ${c.eventDate[currentLang] || c.eventDate.en} | Sowing: ${c.sowDates[currentLang] || c.sowDates.en}\n  States: ${c.statesListText[currentLang] || c.statesListText.en}\n  Advice: ${c.farmerAdvice[currentLang] || c.farmerAdvice.en}`).join('\n\n') +
        `\n\n📲 Download FarmsKing App!`;
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
    }

    // Init
    changeLang('pa');
